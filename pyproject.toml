[project]
name = "repolens"
version = "0.1.0"
description = "RepoLens —— 基于 LangChain 的代码仓库讲解员"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools]
packages = ["repolens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
